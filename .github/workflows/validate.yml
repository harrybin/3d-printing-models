name: Validate model catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned engine
        run: python -m pip install -r requirements.txt
      - name: Prepare engine tools and skills
        run: python -m printforge bootstrap .
      - name: Check catalog completeness
        run: python -m printforge verify-catalog .
      - name: Model regression tests
        run: python scripts/compact_output.py run --log build/tests.log -- python -m unittest discover -s tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-validation
          path: build/tests.log
